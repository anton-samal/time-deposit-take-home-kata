openapi: 3.0.3
info:
  title: XA Bank Time Deposit API
  version: 1.0.0
  description: |
    Exactly two endpoints, as required:
    `GET /time-deposits` lists all time deposits with their withdrawals,
    `POST /time-deposits/balances` applies one month of interest to every time deposit.
tags:
  - name: time-deposits
paths:
  /time-deposits:
    get:
      tags: [time-deposits]
      operationId: getAllTimeDeposits
      summary: Get all time deposits with their withdrawals
      responses:
        '200':
          description: All time deposits, ordered by id
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TimeDepositResponse'
  /time-deposits/balances:
    post:
      tags: [time-deposits]
      operationId: updateAllBalances
      summary: Update the balances of all time deposits
      description: |
        Applies one month of interest to every time deposit, according to its plan type.
        Not idempotent: every call adds another month of interest, so this is a POST.
      responses:
        '204':
          description: Balances updated
components:
  schemas:
    TimeDepositResponse:
      type: object
      required: [id, planType, balance, days, withdrawals]
      properties:
        id:
          type: integer
          format: int32
          example: 2
        planType:
          type: string
          example: basic
        balance:
          type: number
          description: Balance with 2 decimal places
          example: 10008.33
        days:
          type: integer
          format: int32
          example: 31
        withdrawals:
          type: array
          items:
            $ref: '#/components/schemas/WithdrawalResponse'
    WithdrawalResponse:
      type: object
      required: [id, amount, date]
      properties:
        id:
          type: integer
          format: int32
          example: 1
        amount:
          type: number
          example: 500.00
        date:
          type: string
          format: date
          example: '2026-01-15'
